<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('原创小说网站',${application.website.description})}"></head>
<body data-page="home" >
<th:block th:replace="~{common/site :: header('home')}"></th:block>
<main id="main" class="container page-main">
  <section class="hero" aria-labelledby="home-title">
    <div class="hero-intro"><span class="eyebrow">让阅读，回到日常</span><h1 id="home-title">好故事，<br>值得慢慢读。</h1><p>在文字里遇见远方，也遇见自己。<br>选一本喜欢的书，留一点时间给阅读。</p><a class="button button-primary" href="/book/bookclass.html">发现下一本好书<span class="icon icon-next" aria-hidden="true"></span></a></div>
    <div class="hero-feature" th:if="${bookMap['0'] != null and !#lists.isEmpty(bookMap['0'])}" th:with="book=${bookMap['0'][0]}">
      <a th:href="'/book/'+${book.bookId}+'.html'" th:aria-label="${book.bookName}"><span class="cover"><span class="cover-fallback" th:text="${book.bookName}" aria-hidden="true"></span><img th:if="${book.picUrl}" th:src="${book.picUrl}" alt="" width="150" height="210" fetchpriority="high"></span></a>
      <div><span class="eyebrow">本期精选</span><h2><a th:href="'/book/'+${book.bookId}+'.html'" th:text="${book.bookName}"></a></h2><small th:text="${book.authorName}+' 著'"></small><p class="book-desc" data-rich-description th:text="${@seoMetadataService.descriptionText(book.bookDesc)}"></p><a class="text-link" th:href="'/book/'+${book.bookId}+'.html'">走进故事<span class="icon icon-next" aria-hidden="true"></span></a><div class="hero-book-links"><a th:each="pick,s:${bookMap['0']}" th:if="${s.index > 0 and s.index < 4}" th:href="'/book/'+${pick.bookId}+'.html'" th:text="${pick.bookName}"></a></div></div>
    </div>
    <div class="hero-feature" data-home-discover th:if="${bookMap['0'] == null or #lists.isEmpty(bookMap['0'])}"><div style="grid-column:1 / -1"><span class="eyebrow">从这里开始</span><h2>翻开新的一页</h2><p class="section-intro">从全部作品或排行榜中，找到你的下一段旅程。</p></div></div>
  </section>
  <div class="news-strip"><span>书城公告</span><a th:each="news,s:${newsList}" th:if="${s.index < 2}" th:href="'/about/newsInfo-'+${news.id}+'.html'" th:text="${news.title}"></a><a href="/about/news.html" class="text-link">查看全部<span aria-hidden="true">→</span></a></div>
  <nav data-ssr="true" id="home-categories" class="category-strip" aria-label="小说分类"><span>按喜好找书</span><a href="/book/bookclass.html">全部作品</a><a href="/book/bookclass.html?bookStatus=1">完结作品</a><a href="/book/bookclass.html?workDirection=0">男频</a><a href="/book/bookclass.html?workDirection=1">女频</a><a th:each="cat:${homeCategories}" th:href="'/book/bookclass.html?c='+${cat.id}" th:text="${cat.name}"></a></nav>
  <div class="home-columns"><div class="home-main">
    <section class="home-section" id="home-featured" th:attr="data-home-fallback=${bookMap['3'] == null or #lists.isEmpty(bookMap['3']) ? 'true' : null}"><div class="section-heading"><h2 th:text="${bookMap['3'] == null or #lists.isEmpty(bookMap['3']) ? '长篇作品' : '热门推荐'}">热门推荐</h2><a class="text-link" href="/book/bookclass.html">更多作品<span aria-hidden="true">→</span></a></div><div class="book-grid" th:if="${bookMap['3'] != null and !#lists.isEmpty(bookMap['3'])}"><th:block th:each="book:${bookMap['3']}"><article th:replace="~{common/site :: settingCard(${book})}"></article></th:block></div><div class="state-panel" aria-live="polite" th:if="${bookMap['3'] == null or #lists.isEmpty(bookMap['3'])}"><p class="loading-line">暂无推荐作品</p><a class="text-link" href="/book/bookclass.html">浏览全部作品</a></div></section>
    <section th:if="${bookMap['1'] != null and !#lists.isEmpty(bookMap['1'])}" class="home-section"><div class="section-heading"><h2>编辑发现</h2><span class="eyebrow">更多值得翻开的故事</span></div><div class="book-grid"><th:block th:each="book,s:${bookMap['1']}"><th:block th:if="${s.index < 4}"><article th:replace="~{common/site :: settingCard(${book})}"></article></th:block></th:block></div></section>
  </div><aside class="home-rail" aria-label="书籍榜单"><section class="rank-rail" id="home-long-rail" th:attr="data-home-fallback=${bookMap['2'] == null or #lists.isEmpty(bookMap['2']) ? 'true' : null}"><div class="section-heading"><h2 th:text="${bookMap['2'] == null or #lists.isEmpty(bookMap['2']) ? '长篇榜' : '本周推荐'}">本周推荐</h2><a class="text-link" th:href="${bookMap['2'] == null or #lists.isEmpty(bookMap['2']) ? '/book/bookclass.html?sort=word_count' : '/book/book_ranking.html'}" aria-label="查看全部榜单作品">→</a></div><ol class="rank-mini"><li th:each="book,s:${bookMap['2']}"><span class="rank-number" th:text="${s.count < 10 ? '0' + s.count : s.count}"></span><div><a th:href="'/book/'+${book.bookId}+'.html'" th:text="${book.bookName}"></a><small th:text="${book.authorName}"></small></div></li></ol><p th:if="${bookMap['2'] == null or #lists.isEmpty(bookMap['2'])}" class="muted">暂无推荐作品</p></section><section class="rank-rail"><div class="section-heading"><h2>点击榜单</h2><a class="text-link" href="/book/book_ranking.html" aria-label="查看点击榜单">→</a></div><ol id="home-rank" class="rank-mini" data-ssr="true"><li th:each="book,n:${clickRank}" th:if="${n.index < 5}"><span class="rank-number" th:text="${n.count<10?'0'+n.count:n.count}"></span><div><a th:href="'/book/'+${book.id}+'.html'" th:text="${book.bookName}"></a><small th:text="${book.authorName}"></small></div></li><li th:if="${#lists.isEmpty(clickRank)}">暂无榜单</li></ol></section></aside></div>
  <section class="editor-picks" th:if="${bookMap['4'] != null and !#lists.isEmpty(bookMap['4'])}"><div class="section-heading"><h2>精品推荐</h2><a class="text-link" href="/book/bookclass.html">更多好书<span aria-hidden="true">→</span></a></div><div class="book-grid"><th:block th:each="book,s:${bookMap['4']}"><article th:replace="~{common/site :: settingCard(${book})}"></article></th:block></div></section>
  <section class="updates"><div class="section-heading"><h2>最新更新</h2><a class="text-link" href="/book/book_ranking.html?type=2">完整更新榜<span aria-hidden="true">→</span></a></div><div id="home-updates" data-ssr="true"><table class="update-list" th:if="${!#lists.isEmpty(updateRank)}"><thead><tr><th>分类</th><th>作品</th><th>最新章节</th><th>作者</th><th>更新时间</th></tr></thead><tbody><tr th:each="book,n:${updateRank}" th:if="${n.index < 8}"><td th:text="${book.catName}"></td><td><a th:href="'/book/'+${book.id}+'.html'" th:text="${book.bookName}"></a></td><td><a th:if="${book.lastIndexId != null}" th:href="'/book/'+${book.id}+'/'+${book.lastIndexId}+'.html'" th:text="${book.lastIndexName}"></a></td><td th:text="${book.authorName}"></td><td th:text="${book.lastIndexUpdateTime==null?'—':#dates.format(book.lastIndexUpdateTime,'MM-dd HH:mm')}"></td></tr></tbody></table><p th:if="${#lists.isEmpty(updateRank)}">暂时没有更新</p></div></section>
  <div id="friend-links" class="friend-links" hidden></div>
</main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
