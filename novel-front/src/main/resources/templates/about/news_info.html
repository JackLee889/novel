<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head(${news.title},${news.title})}"></head>
<body data-page="article" >
<th:block th:replace="~{common/site :: header('home')}"></th:block>
<main id="main" class="container page-main"><div class="article-layout"><nav class="breadcrumb" aria-label="当前位置"><a href="/">首页</a><span>/</span><a href="/about/news.html">站内公告</a><span>/</span><span>正文</span></nav><article class="content-panel"><div class="article-title"><span class="eyebrow" th:text="${news.catName}"></span><h1 th:text="${news.title}"></h1><p><span th:if="${news.createTime}" th:text="${#dates.format(news.createTime,'yyyy-MM-dd HH:mm')}"></span><span th:if="${news.sourceName}" th:text="' · '+${news.sourceName}"></span></p></div><div class="prose article-body" th:utext="${news.content}"></div></article><a class="text-link" href="/about/news.html">返回公告列表</a></div></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
