<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('书评回复','书评回复，发现好故事，享受阅读。')}"></head>
<body data-page="replies" >
<th:block th:replace="~{common/site :: header('books')}"></th:block>
<main id="main" class="container page-main"><input id="commentId" type="hidden" th:value="${commentId}"><div class="article-layout"><div class="page-title"><div><span class="eyebrow" th:text="${application.website.name}+' · 阅读与生活'">阅读与生活</span><h1>接着聊，这段故事。</h1><p>对一条书评的回应，也可以开启新的交流。</p></div></div><blockquote class="quote-panel" th:text="${commentContent}"></blockquote><section class="content-panel"><form method="post" class="comment-form" id="comment-form"><label for="txtComment" class="sr-only">回复内容</label><textarea id="txtComment" name="replyContent" required maxlength="1000" placeholder="写下你的回应…"></textarea><div class="button-row"><span id="emCommentNum" class="character-count">0 / 1000</span><button class="button button-primary" type="submit">发布回复</button></div><p class="form-status" data-form-status role="status" aria-live="polite"></p></form><div id="comment-results" class="" aria-live="polite"><p class="loading-line">正在加载…</p></div><nav id="pagination" class="pagination" aria-label="分页"></nav></section></div></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
