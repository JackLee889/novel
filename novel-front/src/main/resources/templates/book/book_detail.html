<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head(${book.bookName},${book.bookName}+'，'+${book.authorName}+'著，查看简介、目录与读者书评。')}"></head>
<body data-page="detail" >
<th:block th:replace="~{common/site :: header('books')}"></th:block>
<main id="main" class="container page-main">
<nav class="breadcrumb" aria-label="当前位置"><a href="/">首页</a><span aria-hidden="true">/</span><a href="/book/bookclass.html">全部作品</a><span aria-hidden="true">/</span><a th:href="'/book/bookclass.html?c='+${book.catId}" th:text="${book.catName}"></a><span aria-hidden="true">/</span><span th:text="${book.bookName}"></span></nav>
<input type="hidden" id="bookId" th:value="${book.id}"><input type="hidden" id="preContentId" th:value="${firstBookIndexId}">
<section class="detail-hero"><div class="cover"><span class="cover-fallback" th:text="${book.bookName}" aria-hidden="true"></span><img th:if="${book.picUrl}" th:src="${book.picUrl}" th:alt="${book.bookName}+'封面'" width="190" height="266" fetchpriority="high"></div><div><div class="book-meta"><span class="tag" th:text="${book.catName}"></span><span class="tag tag-green" th:text="${book.bookStatus==1?'已完结':'连载中'}"></span></div><h1 th:text="${book.bookName}"></h1><p class="detail-author"><a th:href="'/book/bookclass.html?k='+${book.authorName}" th:text="${book.authorName}"></a> 著</p><div class="detail-stats"><div><strong th:text="${book.wordCount != null ? #numbers.formatDecimal(book.wordCount / 10000.0,1,1) : '0'}"></strong><span>万字</span></div><div><strong th:text="${book.visitCount != null ? #numbers.formatDecimal(book.visitCount / 10000.0,1,1) : '0'}"></strong><span>万次阅读</span></div><div><strong th:text="${bookCommentPageBean != null ? bookCommentPageBean.total : 0}"></strong><span>条书评</span></div></div></div><div class="button-row detail-actions"><a class="button button-primary" th:if="${firstBookIndexId != null}" th:href="'/book/'+${book.id}+'/'+${firstBookIndexId}+'.html'">开始阅读</a><a class="button button-primary" th:if="${firstBookIndexId == null}" th:href="'/book/indexList-'+${book.id}+'.html'">查看目录</a><button class="button" id="add-shelf">加入书架</button><a class="button button-quiet" th:href="'/book/indexList-'+${book.id}+'.html'">全部目录<span aria-hidden="true">→</span></a></div></section>
<div class="detail-layout"><div><section class="content-panel"><div class="section-heading"><h2>故事简介</h2></div><div class="prose" th:text="${bookDescription}"></div><div class="chapter-update" th:if="${book.lastIndexId != null}"><small>最新章节 · <span th:if="${book.lastIndexUpdateTime}" th:text="${#dates.format(book.lastIndexUpdateTime,'yyyy-MM-dd HH:mm')}"></span></small><a th:href="'/book/'+${book.id}+'/'+${book.lastIndexId}+'.html'" th:text="${book.lastIndexName}"></a></div></section>
<section class="content-panel"><div class="section-heading"><h2>读者书评</h2><a class="text-link" th:href="'/book/comment-'+${book.id}+'.html'">全部书评<span aria-hidden="true">→</span></a></div><form method="post" class="comment-form" id="comment-form"><label for="txtComment" class="sr-only">写下你的阅读感受</label><textarea id="txtComment" name="commentContent" maxlength="1000" required placeholder="读到这里，有什么想说的？"></textarea><div class="button-row"><span class="character-count" id="emCommentNum">0 / 1000</span><button class="button button-primary" type="submit">发布书评</button></div><p class="form-status" data-form-status role="status" aria-live="polite"></p></form><div id="comment-results" aria-live="polite"></div></section></div><aside><div class="section-heading"><h2>同类好书</h2></div><div class="recommend-list"><article class="book-card" th:each="rec:${recBooks}"><a th:href="'/book/'+${rec.id}+'.html'" th:aria-label="${rec.bookName}"><span class="cover"><span class="cover-fallback" th:text="${rec.bookName}" aria-hidden="true"></span><img th:if="${rec.picUrl}" th:src="${rec.picUrl}" alt="" width="90" height="126" loading="lazy"></span></a><div><h3><a th:href="'/book/'+${rec.id}+'.html'" th:text="${rec.bookName}"></a></h3><p class="book-author" th:text="${rec.authorName}"></p><p class="book-desc" data-rich-description th:text="${@seoMetadataService.descriptionText(rec.bookDesc)}"></p></div></article></div></aside></div>
</main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
