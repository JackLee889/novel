<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head(${book.bookName}+'_'+${bookIndex.indexName},${book.bookName}+'，'+${bookIndex.indexName})}"></head>
<body data-page="classic-reader" >
<th:block th:replace="~{common/site :: header('books')}"></th:block>
<main id="main" class="container page-main"><input type="hidden" id="bookId" th:value="${book.id}"><input type="hidden" id="preContentId" th:value="${bookIndex.id}"><section class="classic-reader"><nav class="breadcrumb" aria-label="当前位置"><a th:href="'/book/'+${book.id}+'.html'" th:text="${book.bookName}"></a><span>/</span><a th:href="'/book/indexList-'+${book.id}+'.html'">全部目录</a></nav><h1 th:text="${bookIndex.indexName}"></h1><div class="button-row"><button class="button" data-font-size="-1" aria-label="缩小阅读字号">A−</button><button class="button" data-font-size="1" aria-label="增大阅读字号">A＋</button><button class="button" id="add-shelf">加入书架</button></div><div class="prose" id="classic-content" th:if="${!needBuy}"><p th:each="paragraph:${readerChapter.paragraphs}" th:text="${paragraph.text}"></p></div><div class="state-panel" th:if="${needBuy}"><h2>本章为付费章节</h2><p><span th:text="${bookIndex.bookPrice}"></span> 屋币 · 登录后可购买阅读</p><button class="button button-primary" id="buy-chapter" th:attr="data-id=${bookIndex.id},data-price=${bookIndex.bookPrice}">购买本章</button><a class="button" href="/pay/index.html">账户充值</a></div><nav class="reader-nav" aria-label="章节导航"><a class="button" th:if="${preBookIndexId != '0'}" th:href="'/book/'+${book.id}+'/'+${preBookIndexId}+'.html'">上一章</a><a class="button" th:href="'/book/indexList-'+${book.id}+'.html'">目录</a><a class="button" th:if="${nextBookIndexId != '0'}" th:href="'/book/'+${book.id}+'/'+${nextBookIndexId}+'.html'">下一章</a></nav></section></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
