<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('全部作品','全部作品，发现好故事，享受阅读。')}"></head>
<body data-page="catalog">
<th:block th:replace="~{common/site :: header('books')}"></th:block>
<main id="main" class="container page-main">
  <div class="page-title"><div><span class="eyebrow" th:text="${application.website.name}+' · 阅读与生活'"></span><h1 th:text="${catalogLabel}">下一本，读什么？</h1><p>从喜欢的题材开始，找到属于你的故事。</p></div><a class="button button-quiet" id="reset-filters" href="/book/bookclass.html">重置筛选</a></div>
  <section class="filters" aria-label="作品筛选">
    <div class="filter-row"><span class="filter-label">频道</span><div class="filter-options" data-filter="workDirection"><a th:href="${catalogQuery.filterUrl('workDirection','')}" data-value="">全部</a><a th:href="${catalogQuery.filterUrl('workDirection','0')}" data-value="0">男频</a><a th:href="${catalogQuery.filterUrl('workDirection','1')}" data-value="1">女频</a></div></div>
    <div class="filter-row"><span class="filter-label">分类</span><div class="filter-options" id="category-options" data-filter="catId"><a th:href="${catalogQuery.filterUrl('c','')}" data-value="">不限</a><a th:each="cat:${catalogCategories}" th:href="${catalogQuery.filterUrl('c',cat.id.toString())}" th:attr="data-value=${cat.id}" th:text="${cat.name}"></a></div></div>
    <div class="filter-row"><span class="filter-label">状态</span><div class="filter-options" data-filter="bookStatus"><a th:href="${catalogQuery.filterUrl('bookStatus','')}" data-value="">不限</a><a th:href="${catalogQuery.filterUrl('bookStatus','0')}" data-value="0">连载中</a><a th:href="${catalogQuery.filterUrl('bookStatus','1')}" data-value="1">已完结</a></div></div>
    <div class="filter-row"><span class="filter-label">字数</span><div class="filter-options words" data-filter="words"><a th:href="${catalogQuery.filterUrl('words','')}" data-value="">不限</a><a th:href="${catalogQuery.filterUrl('words','0:300000')}" data-value="0:300000">30万字以下</a><a th:href="${catalogQuery.filterUrl('words','300000:500000')}" data-value="300000:500000">30–50万字</a><a th:href="${catalogQuery.filterUrl('words','500000:1000000')}" data-value="500000:1000000">50–100万字</a><a th:href="${catalogQuery.filterUrl('words','1000000:')}" data-value="1000000:">100万字以上</a></div><select class="filter-select" data-filter-select="words" aria-label="按字数筛选"><option value="">不限字数</option><option value="0:300000">30万字以下</option><option value="300000:500000">30–50万字</option><option value="500000:1000000">50–100万字</option><option value="1000000:">100万字以上</option></select></div>
    <div class="filter-row"><span class="filter-label">更新</span><div class="filter-options period" data-filter="updatePeriod"><a th:href="${catalogQuery.filterUrl('updatePeriod','')}" data-value="">不限</a><a th:href="${catalogQuery.filterUrl('updatePeriod','3')}" data-value="3">三日内</a><a th:href="${catalogQuery.filterUrl('updatePeriod','7')}" data-value="7">七日内</a><a th:href="${catalogQuery.filterUrl('updatePeriod','15')}" data-value="15">半月内</a><a th:href="${catalogQuery.filterUrl('updatePeriod','30')}" data-value="30">一月内</a></div><select class="filter-select" data-filter-select="updatePeriod" aria-label="按更新时间筛选"><option value="">不限更新时间</option><option value="3">三日内</option><option value="7">七日内</option><option value="15">半月内</option><option value="30">一月内</option></select></div>
  </section>
  <div class="results-toolbar"><p id="result-count" role="status" th:text="'找到 '+${catalogPage.total}+' 部作品'"></p><label><span class="sr-only">作品排序</span><select id="sort-books"><option value="last_index_update_time">按更新时间</option><option value="word_count">按总字数</option><option value="visit_count">按点击量</option></select></label></div>
  <div id="book-results" class="book-grid catalog-grid" data-ssr="true"><th:block th:each="book:${catalogPage.list}"><article th:replace="~{common/site :: bookCard(${book})}"></article></th:block><div th:if="${#lists.isEmpty(catalogPage.list)}" class="state-panel"><h2>还没有找到合适的作品</h2><p>试试其他关键词，或放宽筛选条件。</p></div></div>
  <th:block th:replace="~{common/site :: pagination}"></th:block>
</main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
