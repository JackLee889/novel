<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('反馈留言','反馈留言，发现好故事，享受阅读。')}"></head>
<body data-page="feedback" data-requires-login>
<th:block th:replace="~{common/site :: header('user')}"></th:block>
<main id="main" class="container page-main"><div class="account-layout"><nav th:replace="~{common/site :: accountNav('feedback')}"></nav><section class="account-content"><h1>反馈留言</h1><form method="post" class="form-panel" id="Form1"><p class="form-intro">遇到问题，或有想法想告诉我们？请尽量描述所在页面与具体情况。</p><div class="field"><label for="txtDescription">留言内容</label><textarea id="txtDescription" name="txtDescription" required maxlength="2000" rows="7" placeholder="写下你的问题或建议…"></textarea><small>最多 2000 字。</small></div><p id="LabErr" class="form-status" role="status" aria-live="polite"></p><div class="button-row"><button class="button button-primary" id="btnSave" type="submit">提交留言</button><a class="text-link" href="/user/feedback_list.html">查看我的反馈</a></div></form></section></div></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
