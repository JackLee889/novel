<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('登录','登录，发现好故事，享受阅读。')}"></head>
<body data-page="login" >
<th:block th:replace="~{common/site :: header('user')}"></th:block>
<main id="main" class="container page-main"><div class="auth-layout"><div class="auth-story"><span class="eyebrow">故事在这里继续</span><p class="auth-statement">书页之间，<br>总有新的相逢。</p><p>读过的每一章，喜欢的每一本，都为你留在这里。</p><small>阅读 · 收藏 · 创作</small></div><form method="post" class="auth-form" id="form1"><h1 class="auth-title">欢迎回来</h1><p class="form-intro">登录后，继续上一次的故事。</p><div class="field"><label for="txtUName">手机号码</label><input id="txtUName" name="txtUName" type="tel" required inputmode="tel" autocomplete="username" maxlength="11" placeholder="请输入手机号码" pattern="1[3-9][0-9]{9}"></div><div class="field"><label for="txtPassword">密码</label><div class="password-wrap"><input id="txtPassword" name="txtPassword" type="password" required autocomplete="current-password" ><button class="password-toggle" type="button" data-password-toggle="txtPassword" aria-label="显示密码" aria-pressed="false">显示</button></div></div><div class="auth-options"><label><input id="autoLogin" name="autoLogin" type="checkbox">下次自动登录</label><a href="/user/feedback.html">需要帮助？</a></div><p id="LabErr" class="form-status" role="status" aria-live="polite"></p><button class="button button-primary" id="btnLogin" type="submit">登录</button><div class="auth-bottom">还没有账户？ <a href="/user/register.html">免费注册</a></div></form></div></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
