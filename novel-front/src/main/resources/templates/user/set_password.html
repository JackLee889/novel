<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('修改密码','修改密码，发现好故事，享受阅读。')}"></head>
<body data-page="set-password" data-requires-login>
<th:block th:replace="~{common/site :: header('user')}"></th:block>
<main id="main" class="container page-main"><div class="account-layout"><nav th:replace="~{common/site :: accountNav('set_password')}"></nav><section class="account-content"><h1>修改密码</h1><form method="post" class="form-panel" id="password-form"><div class="field"><label for="txtOldPass">当前密码</label><input id="txtOldPass" name="oldPass" type="password" required autocomplete="current-password"></div><div class="field"><label for="txtNewPass1">新密码</label><input id="txtNewPass1" name="txtNewPass1" type="password" required minlength="6" autocomplete="new-password"></div><div class="field"><label for="txtNewPass2">确认新密码</label><input id="txtNewPass2" name="txtNewPass2" type="password" required minlength="6" autocomplete="new-password"></div><p id="LabErr" class="form-status" role="status" aria-live="polite"></p><button class="button button-primary" id="btnExchangePassword" type="submit">更新密码</button></form></section></div></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
