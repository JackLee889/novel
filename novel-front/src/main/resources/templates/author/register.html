<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('申请作者','申请作者，发现好故事，享受阅读。')}"></head>
<body data-page="author-register" data-requires-login>
<th:block th:replace="~{common/site :: header('author')}"></th:block>
<main id="main" class="container page-main"><div class="article-layout"><div class="page-title"><div><span class="eyebrow" th:text="${application.website.name}+' · 阅读与生活'">阅读与生活</span><h1>让你的故事，被更多人看见。</h1><p>申请成为作者，从这里开启创作。</p></div></div><form method="post" action="/author/register.html" id="form1" class="form-panel wide"><div class="field"><label for="TxtGetCode">作者邀请码</label><input id="TxtGetCode" name="inviteCode" type="text" required maxlength="12" th:value="${author.inviteCode}"></div><div class="field"><label for="TxtNiceName">笔名</label><input id="TxtNiceName" name="penName" type="text" required maxlength="8" th:value="${author.penName}"></div><div class="field"><label for="TxtMobile">联系电话</label><input id="TxtMobile" name="telPhone" type="tel" required maxlength="11" th:value="${author.telPhone}"></div><div class="field"><label for="TxtQQ">QQ 或微信</label><input id="TxtQQ" name="chatAccount" type="text" required maxlength="50" th:value="${author.chatAccount}"></div><div class="field"><label for="TxtEmail">电子邮箱</label><input id="TxtEmail" name="email" type="email" required maxlength="100" th:value="${author.email}"></div><input type="hidden" name="workDirection" id="HidSexclass" value="0"><p id="LabErr" class="form-status" role="status" aria-live="polite" th:text="${LabErr}"></p><button class="button button-primary" id="btnSubmit" type="submit">提交作者申请</button></form></div></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
