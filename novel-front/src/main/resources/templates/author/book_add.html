<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('新建作品','新建作品，发现好故事，享受阅读。')}"></head>
<body data-page="author-add" data-requires-login>
<th:block th:replace="~{common/site :: header('author')}"></th:block>
<main id="main" class="container page-main"><div class="account-layout"><nav th:replace="~{common/site :: authorNav('book_add')}"></nav><section class="account-content"><div class="author-topline"><h1>新建作品</h1></div><form method="post" class="form-panel wide" id="form2"><p class="form-intro">每个故事，都从一个名字开始。填写作品信息，建立你的新书。</p><div class="form-columns"><div class="field"><label for="workDirection">作品频道</label><select id="workDirection" name="workDirection"><option value="0">男频</option><option value="1">女频</option></select></div><div class="field"><label for="catId">作品分类</label><select id="catId" name="catId" required><option value="">正在加载分类…</option></select><input type="hidden" id="catName" name="catName"></div></div><div class="field"><label for="bookName">作品名称</label><input id="bookName" name="bookName" type="text" required maxlength="50" placeholder="给故事起一个名字"></div><div class="field"><label for="file0">作品封面</label><div class="upload-preview"><div class="cover"><span class="cover-fallback" aria-hidden="true">新作</span><img id="book-pic-preview" alt="作品封面预览" hidden width="110" height="154"></div><div><p>上传一张封面，让读者先看见故事的气质。</p><input id="file0" type="file" name="file" accept="image/jpeg,image/png,image/gif,image/webp"></div></div><input id="picUrl" name="picUrl" type="hidden" value="/images/default.gif"></div><div class="field"><label for="bookDesc">作品简介</label><textarea id="bookDesc" name="bookDesc" required rows="6" maxlength="2000" placeholder="向读者介绍你的故事…"></textarea></div><p id="LabErr" class="form-status" role="status" aria-live="polite"></p><button class="button button-primary" id="btnRegister" type="submit">创建作品</button></form></section></div></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
