<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('编辑章节','编辑章节，发现好故事，享受阅读。')}"></head>
<body data-page="author-edit" data-requires-login>
<th:block th:replace="~{common/site :: header('author')}"></th:block>
<main id="main" class="container page-main"><div class="account-layout"><nav th:replace="~{common/site :: authorNav('index')}"></nav><section class="account-content"><div class="author-topline"><h1>编辑章节</h1></div><section class="writing-workspace"><form method="post" class="form-panel wide" id="form2"><div class="field"><label for="bookIndex">章节名称</label><input id="bookIndex" name="bookIndex" type="text" required maxlength="100" placeholder="例如：第一章 雨港的清晨"></div><div class="field"><label for="bookContent">章节正文</label><div><div class="writing-toolbar" aria-label="写作辅助"><span>选中文字后使用写作辅助</span><button type="button" data-ai="expand">扩写</button><button type="button" data-ai="condense">缩写</button><button type="button" data-ai="continue">续写</button><button type="button" data-ai="polish">润色</button><button type="button" id="restore-draft">恢复本地草稿</button></div><textarea id="bookContent" name="bookContent" required placeholder="故事从这里开始…" spellcheck="false"></textarea><p class="editor-count" id="editor-count" role="status">0 字 · 本地草稿自动保存</p></div></div><p class="form-intro">章节付费类型保留原设置。</p><p id="LabErr" class="form-status" role="status" aria-live="polite"></p><div class="save-bar"><a class="text-link" id="back-chapters" href="/author/index.html">返回章节管理</a><div class="button-row"><button class="button button-primary" id="btnRegister" type="submit">保存修改</button></div></div></form></section></section></div></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
