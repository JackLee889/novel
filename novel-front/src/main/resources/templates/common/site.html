<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title,description)">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${seo != null and !#strings.isEmpty(seo.title) ? seo.title : title + '_' + application.website.name}">小说精品屋</title>
  <meta name="description" th:content="${seo != null and !#strings.isEmpty(seo.description) ? seo.description : description}"><meta name="keywords" th:content="${seo != null ? seo.keywords : application.website.keyword}">
  <meta name="robots" th:content="${seo != null ? seo.robots : 'noindex,follow'}">
  <meta name="google-site-verification" th:if="${seoVerification != null and !#strings.isEmpty(seoVerification['google'])}" th:content="${seoVerification['google']}">
  <meta name="baidu-site-verification" th:if="${seoVerification != null and !#strings.isEmpty(seoVerification['baidu'])}" th:content="${seoVerification['baidu']}">
  <link rel="canonical" th:if="${seo != null and !#strings.isEmpty(seo.canonical)}" th:href="${seo.canonical}">
  <script id="seo-jsonld" type="application/ld+json" th:if="${seo != null and !#strings.isEmpty(seo.jsonLd)}" th:utext="${seo.jsonLd}"></script>
  <meta name="reader-tts-enabled" th:content="${globalReaderEnabled}">
  <link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/css/site.css?v=20261008.5">
  <link rel="stylesheet" href="/css/global-player.css?v=20261007.2">
  <link rel="stylesheet" href="/css/player-dock.css?v=20261007.3">
  <link rel="stylesheet" href="/css/stats.css?v=20261009.7">
  <script type="module" src="/javascript/site/stats.js?v=20261009.2"></script>
  <script src="/javascript/site/theme.js"></script><script type="module" src="/javascript/site/site.js?v=20261020.1"></script>
  <script>var _hmt=_hmt||[];(function(){var hm=document.createElement('script');hm.src='https://hm.baidu.com/hm.js?ecc8b50a3122e6d5e09be7a9e5383e07';hm.async=true;document.head.appendChild(hm);})();</script>
</head>
<body>
<th:block th:fragment="header(active)">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="container header-main">
      <a href="/" class="brand" th:aria-label="${application.website.name} + '首页'"><img class="site-logo" th:src="${application.website.logo}" th:alt="${application.website.name}" width="800" height="200"></a>
      <form class="site-search" action="/book/bookclass.html" method="get" role="search"><label for="searchKey" class="sr-only">搜索书名或作者</label><input id="searchKey" name="k" type="search" placeholder="书名、作者、关键字" autocomplete="off"><button type="submit" id="btnSearch" class="icon-button" aria-label="搜索"><span class="icon icon-search" aria-hidden="true"></span></button></form>
      <div class="header-actions"><a class="header-shelf" href="/user/favorites.html" aria-label="我的书架"><span class="icon icon-book" aria-hidden="true"></span><span>我的书架</span></a><div class="header-auth" data-header-auth><a href="/user/login.html">登录</a><a href="/user/register.html">注册</a></div><button class="icon-button" data-theme-toggle aria-label="切换夜间模式" aria-pressed="false" title="切换日夜模式"><span class="icon icon-moon" aria-hidden="true"></span></button><button class="icon-button mobile-toggle" data-menu-toggle aria-controls="primary-nav" aria-expanded="false" aria-label="打开导航"><span class="icon icon-menu" aria-hidden="true"></span></button></div>
    </div>
    <nav class="container primary-nav" id="primary-nav" aria-label="主导航">
      <a href="/" th:attr="aria-current=${active == 'home' ? 'page' : null}">首页</a><a href="/book/bookclass.html" th:attr="aria-current=${active == 'books' ? 'page' : null}">全部作品</a><a href="/book/book_ranking.html" th:attr="aria-current=${active == 'rank' ? 'page' : null}">排行榜</a><a href="/pay/index.html" th:attr="aria-current=${active == 'pay' ? 'page' : null}" th:if="${businessFeatures != null and businessFeatures.paymentEnabled}">充值</a><a href="/author/index.html" th:attr="aria-current=${active == 'author' ? 'page' : null}" th:if="${businessFeatures != null and businessFeatures.submissionEnabled}">作家专区</a><a href="/user/userinfo.html" th:attr="aria-current=${active == 'user' ? 'page' : null}">个人中心</a><div class="mobile-auth header-auth" data-mobile-auth><a href="/user/login.html">登录</a><a href="/user/register.html">注册</a></div><span class="nav-caption">一页故事，一段时光</span>
    </nav>
  </header>
</th:block>
  <section class="site-stats" th:fragment="stats(compact)" th:classappend="${compact ? 'site-stats--reader' : ''}" data-site-stats data-online="false" aria-label="网站访问统计" aria-describedby="site-stats-description" aria-busy="true">
    <div class="site-stats-inner">
      <p class="site-stats-sr" id="site-stats-description"><span data-stats-window>当前在线为最近 90 秒内仍在浏览的访客。</span> 同一浏览器的多个标签页计为一位在线访客。累计访问记录页面打开和实际章节翻页。<span data-stats-since>累计数据从功能启用时开始记录。</span></p>
      <dl class="site-stats-list">
        <div class="site-stats-item"><dt class="site-stats-label" aria-label="当前在线"><span class="site-stats-dot" aria-hidden="true"></span><span class="site-stats-label-full">当前在线</span><span class="site-stats-label-short" aria-hidden="true">在线</span></dt><dd class="site-stats-number"><span class="site-stats-value" data-stats-online aria-hidden="true">—</span><span class="site-stats-unit" data-stats-unit-online aria-hidden="true" hidden>人</span><span class="site-stats-sr" data-stats-full-online>正在加载</span></dd></div>
        <div class="site-stats-item"><dt class="site-stats-label" aria-label="累计访问"><span class="site-stats-label-full">累计访问</span><span class="site-stats-label-short" aria-hidden="true">访问</span></dt><dd class="site-stats-number"><span class="site-stats-value" data-stats-views aria-hidden="true">—</span><span class="site-stats-unit" data-stats-unit-views aria-hidden="true" hidden>次</span><span class="site-stats-sr" data-stats-full-views>正在加载</span></dd></div>
      </dl>
      <p class="site-stats-status" data-stats-status role="status" aria-live="polite">统计加载中</p>
    </div>
  </section>
<th:block th:fragment="footer">
  <footer class="site-footer"><div class="container footer-inner"><div><p class="footer-name" th:text="${application.website.name}">小说精品屋</p><p th:text="'Copyright (C) ' + ${application.website.domain} + ' All rights reserved. ' + ${application.website.name} + '版权所有'"></p></div><th:block th:replace="~{common/site :: stats(false)}"></th:block><nav class="footer-links" aria-label="页脚导航"><a href="/">网站首页</a><a href="/about/news.html">站内公告</a><a href="/user/feedback.html">反馈留言</a><a href="/author/index.html" th:if="${businessFeatures != null and businessFeatures.submissionEnabled}">作家专区</a></nav></div></footer>
  <dialog id="site-dialog" class="site-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" data-dialog-close aria-label="关闭"><span class="icon icon-close" aria-hidden="true"></span></button></div><div class="dialog-content" id="dialog-content"></div><form class="dialog-form" id="dialog-form" method="dialog"><input id="dialog-input" aria-label="输入内容" hidden><div class="button-row"><button class="button" value="cancel">取消</button><button class="button button-primary" value="confirm">确认</button></div></form></dialog>
  <div class="toast" id="site-toast" role="status" aria-live="polite" hidden></div>
</th:block>
<nav th:fragment="accountNav(active)" class="side-nav" aria-label="个人中心导航"><a href="/user/userinfo.html" th:attr="aria-current=${active=='userinfo'?'page':null}">个人中心</a><a href="/user/favorites.html" th:attr="aria-current=${active=='favorites'?'page':null}">我的书架</a><a href="/user/read_history.html" th:attr="aria-current=${active=='read_history'?'page':null}">最近阅读</a><a href="/user/comment.html" th:attr="aria-current=${active=='comment'?'page':null}">我的评论</a><span class="side-nav-label">账户与设置</span><a href="/user/setup.html" th:attr="aria-current=${active=='setup'?'page':null}">个人资料</a><a href="/user/set_name.html" th:attr="aria-current=${active=='set_name'?'page':null}">修改昵称</a><a href="/user/set_sex.html" th:attr="aria-current=${active=='set_sex'?'page':null}">修改性别</a><a href="/user/set_password.html" th:attr="aria-current=${active=='set_password'?'page':null}">修改密码</a><a href="/pay/index.html" th:if="${businessFeatures != null and businessFeatures.paymentEnabled}">账户充值</a><a href="/user/feedback.html" th:attr="aria-current=${active=='feedback'?'page':null}">反馈留言</a><a href="/user/feedback_list.html" th:attr="aria-current=${active=='feedback_list'?'page':null}">我的反馈</a><button data-logout>退出登录</button></nav>
<nav th:fragment="authorNav(active)" class="side-nav" aria-label="作家中心导航"><a href="/author/index.html" th:attr="aria-current=${active=='index'?'page':null}" th:if="${businessFeatures != null and businessFeatures.submissionEnabled}">我的作品</a><a href="/author/book_add.html" th:attr="aria-current=${active=='book_add'?'page':null}" th:if="${businessFeatures != null and businessFeatures.submissionEnabled}">新建作品</a><a href="/author/author_income.html" th:attr="aria-current=${active=='author_income'?'page':null}" th:if="${businessFeatures != null and businessFeatures.submissionEnabled}">稿费收入</a><a href="/author/author_income_detail.html" th:attr="aria-current=${active=='author_income_detail'?'page':null}" th:if="${businessFeatures != null and businessFeatures.submissionEnabled}">订阅明细</a><span class="side-nav-label">阅读与账户</span><a href="/user/userinfo.html">个人中心</a><a href="/">返回书城</a></nav>
<a th:fragment="cover(src,name)" class="cover" th:attr="aria-label=${name}"><span class="cover-fallback" th:text="${name}" aria-hidden="true"></span><img th:if="${src != null and src != ''}" th:src="${src}" alt="" loading="lazy" width="150" height="210"></a>
<article th:fragment="settingCard(book)" class="book-card"><a class="cover-link" th:href="'/book/'+${book.bookId}+'.html'" th:aria-label="${book.bookName}"><span class="cover"><span class="cover-fallback" th:text="${book.bookName}" aria-hidden="true"></span><img th:if="${book.picUrl}" th:src="${book.picUrl}" alt="" width="150" height="210" loading="lazy"></span></a><div><h3><a th:href="'/book/'+${book.bookId}+'.html'" th:text="${book.bookName}"></a></h3><p class="book-author" th:text="${book.authorName} + ' 著'"></p><p class="book-desc" data-rich-description th:text="${@seoMetadataService.descriptionText(book.bookDesc)}"></p><div class="book-meta"><span class="tag" th:if="${book.catName}" th:text="${book.catName}"></span><span class="tag tag-green" th:text="${book.bookStatus == 1 ? '已完结' : '连载中'}"></span></div></div></article>
<article th:fragment="bookCard(book)" class="book-card"><a class="cover-link" th:href="'/book/'+${book.id}+'.html'" th:aria-label="${book.bookName}"><span class="cover"><span class="cover-fallback" th:text="${book.bookName}" aria-hidden="true"></span><img th:if="${book.picUrl}" th:src="${book.picUrl}" th:alt="${book.bookName}+'封面'" width="150" height="210" loading="lazy"></span></a><div><h3><a th:href="'/book/'+${book.id}+'.html'" th:text="${book.bookName}"></a></h3><p class="book-author" th:text="${book.authorName}+' 著'"></p><p class="book-desc" data-rich-description th:text="${@seoMetadataService.descriptionText(book.bookDesc)}"></p><div class="book-meta"><a class="tag" th:href="'/book/bookclass.html?c='+${book.catId}" th:text="${book.catName}"></a><span class="tag tag-green" th:text="${book.bookStatus == 1 ? '已完结' : '连载中'}"></span></div></div></article>
<nav th:fragment="pagination" id="pagination" class="pagination" aria-label="分页" th:if="${totalPages > 1}"><a th:each="link:${paginationLinks}" th:href="${link.url}" th:text="${link.label}" th:attr="aria-current=${link.current ? 'page' : null},rel=${#strings.isEmpty(link.rel) ? null : link.rel}"></a><span th:text="'共 '+${totalPages}+' 页'"></span></nav>
</body></html>
