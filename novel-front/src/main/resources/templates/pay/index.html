<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head th:replace="~{common/site :: head('账户充值','账户充值，发现好故事，享受阅读。')}"></head>
<body data-page="pay" data-requires-login>
<th:block th:replace="~{common/site :: header('pay')}"></th:block>
<main id="main" class="container page-main"><div class="page-title"><div><span class="eyebrow" th:text="${application.website.name}+' · 阅读与生活'">阅读与生活</span><h1>给阅读，留一点余量。</h1><p>充值屋币，用于书城内的付费章节阅读。</p></div></div><form action="/pay/aliPay" method="post" id="payform" name="payform" class="pay-layout"><section class="content-panel"><div class="section-heading"><h2>选择充值方式与金额</h2></div><p class="muted">充值账号：<span id="my_name">正在加载…</span> · 当前余额 <span id="accountBalance">—</span> 屋币</p><div class="payment-provider"><label><input type="radio" name="provider-choice" value="alipay" checked><img src="/images/pay_zfb.png" alt="支付宝支付" width="150" height="40"></label><label class="unavailable"><input type="radio" name="provider-choice" value="wechat" disabled><img src="/images/pay_wx.png" alt="微信支付" width="150" height="40"><span>暂未开通</span></label></div><h3>充值金额</h3><div class="amount-grid"><label class="amount-option"><input type="radio" name="amount-choice" value="10" ><strong>10<small>元</small></strong><span>1000 屋币</span></label><label class="amount-option"><input type="radio" name="amount-choice" value="30" ><strong>30<small>元</small></strong><span>3000 屋币</span></label><label class="amount-option"><input type="radio" name="amount-choice" value="50" checked><strong>50<small>元</small></strong><span>5000 屋币</span></label><label class="amount-option"><input type="radio" name="amount-choice" value="100" ><strong>100<small>元</small></strong><span>10000 屋币</span></label><label class="amount-option"><input type="radio" name="amount-choice" value="200" ><strong>200<small>元</small></strong><span>20000 屋币</span></label><label class="amount-option"><input type="radio" name="amount-choice" value="500" ><strong>500<small>元</small></strong><span>50000 屋币</span></label></div><p class="muted">当前汇率：1 元 = 100 屋币</p><div class="legal-note"><strong>温馨提示</strong><ul><li>1. 充值阅读权限仅限本书城使用</li><li>2. 支付宝支持信用卡、借记卡、支付宝余额等支付；微信支付暂未开通</li><li>3. 包年时间是365天，重复购买时间会累加</li><li>4. 若充值遇到问题，<a class="text-link" href="/user/feedback.html">点此留言</a></li></ul></div></section><aside class="order-summary"><h2>本次充值</h2><dl><div><dt>获得屋币</dt><dd id="showRemark">5000 屋币</dd></div><div><dt>付款方式</dt><dd>支付宝</dd></div></dl><div class="order-total"><span>应付金额</span><br><strong id="showTotal">¥ 50</strong></div><p class="form-status" data-form-status role="status" aria-live="polite"></p><button type="submit" class="button button-primary">前往支付宝支付<span class="icon icon-next" aria-hidden="true"></span></button><p class="legal-note">点击支付后将进入支付宝收银台，完成付款后以实际到账为准。</p></aside><input type="hidden" id="pValue" name="payAmount" value="50"></form></main>
<th:block th:replace="~{common/site :: footer}"></th:block>
</body></html>
