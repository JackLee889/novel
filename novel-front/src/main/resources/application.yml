visitor-stats:
  enabled: ${VISITOR_STATS_ENABLED:true}
  site-url: ${VISITOR_STATS_SITE_URL:${SEO_SITE_URL:}}
  allowed-origins: ${VISITOR_STATS_ALLOWED_ORIGINS:}

server:
  port: 8083

features:
  payment-enabled: ${FEATURES_PAYMENT_ENABLED:false}
  ai-enabled: ${FEATURES_AI_ENABLED:false}
  submission-enabled: ${FEATURES_SUBMISSION_ENABLED:false}

reader:
  enabled: ${READER_ENABLED:true}
  tts:
    enabled: ${READER_TTS_ENABLED:true}
    resource-directory: ${READER_TTS_RESOURCE_DIRECTORY:./reader-resources}
    manifest-url: /reader/tts-manifest.json

spring:
  profiles:
    active: dev
    include: website,alipay,oss

jwt:
  secret: ${JWT_SECRET:change-me-before-deployment}
  expiration: 604800

#缓存管理密码
cache:
  manager:
    password: ${CACHE_MANAGER_PASSWORD:change-me-before-deployment}


# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接 （多个用逗号分隔）
  urlPatterns: /book/addCommentReply,/book/addBookComment,/user/addFeedBack,/author/addBook,/author/addBookContent,/author/updateBookContent,/author/register.html


author:
  income:
    #税率(扣税后所得比率)
    tax-rate: 0.9
    #分佣比例
    share-proportion: 0.7
    #兑换比率(人民币)
    exchange-proportion: 0.01

#小说章节定价规则
book:
  price:
    #字数
    word-count: 1000
    #价值(屋币)
    value: 5


--- #--------------------- Spring AI 配置----------------------
spring:
  ai:
    openai:
      image:
        enabled: true
        base-url: https://api.siliconflow.cn
        api-key: ${OPENAI_IMAGE_API_KEY:${OPENAI_API_KEY:disabled-local-only}}
        options:
          model: Kwai-Kolors/Kolors
          response_format: URL
      api-key: ${OPENAI_API_KEY:disabled-local-only}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B


