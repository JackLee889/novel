<script language="javascript" type="text/javascript">
    function load() {
        var testParseUrl = localStorage.getItem("testParseUrl");
        $("#url").val(testParseUrl);
        var testParseRule = localStorage.getItem("testParseRule");
        $("#rule").val(testParseRule);
        $("#charset").val(localStorage.getItem("testParseCharset") || "utf-8");
    }

    function testCrawlSource() {

        var data = {};


        var isRefresh = $("#isRefresh").val();
        data.isRefresh = isRefresh;
        var rule = $("#rule").val();
        if (rule.length == 0) {
            layer.alert("正则必填");
            return false;
        }
        data.rule = rule;
        var url = $("#url").val();
        if (url.length == 0) {
            layer.alert("url必填");
            return false;
        }
        data.url = url;
        data.charset = $("#charset").val();

        localStorage.setItem("testParseUrl", url);
        localStorage.setItem("testParseRule", rule);
        localStorage.setItem("testParseCharset", data.charset);
        $.ajax({
            type: "POST",
            url: "/crawl/testParse",
            data: data,
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $("#resultMap").val(JSON.stringify(data.data));
                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    }

</script>
