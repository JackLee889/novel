spring:
  config:
    import: classpath:application-common.yml
  main:
    allow-bean-definition-overriding: true
  data:
    redis:
      #Redis服务器IP
      host: ${REDIS_HOST:127.0.0.1}
      #Redis服务器连接端口
      port: ${REDIS_PORT:6379}
      #Redis服务器连接密码
      password: ${REDIS_PASSWORD:}
      #连接超时时间（毫秒）
      timeout: 10000

logging:
  level:
    root: error
    com.java2nb: error



content:
  save:
    storage: db #存储介质，db：数据库，file：txt文本
    path: ${CONTENT_SAVE_PATH:./data/books}  #txt小说文本保存路径

# HTTP 代理配置
http:
  proxy:
    # 是否开启 HTTP 代理，true-开启，false-不开启
    enabled: ${HTTP_PROXY_ENABLED:false}
    # 代理 IP
    ip: ${HTTP_PROXY_HOST:127.0.0.1}
    # 代理端口号
    port: ${HTTP_PROXY_PORT:80}



