spring:
  config:
    import: classpath:application-common.yml
  main:
    allow-bean-definition-overriding: true
  #Redis服务器IP
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      #Redis服务器连接端口
      port: ${REDIS_PORT:6379}
      #Redis服务器连接密码
      password: ${REDIS_PASSWORD:}
      #连接超时时间（毫秒）
      timeout: 10000

content:
  save:
    storage: db # 小说内容存储方式：db-数据库，txt-TXT文本
    path: ${CONTENT_SAVE_PATH:./data/books}  # 小说TXT文本保存路径

# HTTP 代理配置
http:
  proxy:
    # 是否开启 HTTP 代理，true-开启，false-不开启
    enabled: ${HTTP_PROXY_ENABLED:false}
    # 代理 IP
    ip: ${HTTP_PROXY_HOST:127.0.0.1}
    # 代理端口号
    port: ${HTTP_PROXY_PORT:2312}
    # 代理用户名
    username: ${HTTP_PROXY_USERNAME:}
    # 代理密码
    password: ${HTTP_PROXY_PASSWORD:}