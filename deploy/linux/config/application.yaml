visitor-stats:
  enabled: ${VISITOR_STATS_ENABLED:true}
  site-url: ${VISITOR_STATS_SITE_URL:${SEO_SITE_URL:}}
  allowed-origins: ${VISITOR_STATS_ALLOWED_ORIGINS:}

# Shared runtime override. Module classpath configs provide their own mapper
# settings; deployment paths, credentials and profiles are explicit here.
server:
  port: 8080
  forward-headers-strategy: framework

spring:
  config:
    # Optional private migration config stays outside the image/release manifest.
    import: optional:file:/app/config/private.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_JDBC_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # ShiroConfig also reads this value as an integer in milliseconds.
      timeout: 10000
  thymeleaf:
    mode: HTML
    cache: true
  ai:
    openai:
      # Current AiConfig builds ChatClient even while the business feature is
      # disabled. A nonsecret sentinel satisfies configuration without API calls.
      api-key: ${OPENAI_API_KEY:disabled}
      image:
        enabled: ${FEATURES_AI_ENABLED:false}
        api-key: ${OPENAI_API_KEY:disabled}
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  config: file:/app/config/logback-spring.xml

content:
  save:
    storage: ${CONTENT_SAVE_STORAGE:db}
    path: /data/books
pic:
  save:
    type: ${PIC_SAVE_TYPE:1}
    storage: ${PIC_SAVE_STORAGE:local}
    path: /data/pic
java2nb:
  uploadPath: /data/pic/
  username: ${ADMIN_BOOTSTRAP_USERNAME:}
  password: ${ADMIN_BOOTSTRAP_PASSWORD:}
http:
  proxy:
    enabled: false
    username: ${HTTP_PROXY_USERNAME:}
    password: ${HTTP_PROXY_PASSWORD:}
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:604800}
cache:
  manager:
    password: ${CACHE_MANAGER_PASSWORD:}
admin:
  username: ${CRAWL_ADMIN_USERNAME:admin}
  password: ${CRAWL_ADMIN_PASSWORD:}
  security:
    secure-cookie: ${ADMIN_SECURITY_SECURE_COOKIE:true}
crawl:
  jobs:
    enabled: ${CRAWL_JOBS_ENABLED:false}
  update:
    thread: ${CRAWL_UPDATE_THREAD:0}
disk-monitor:
  enabled: false

features:
  payment-enabled: ${FEATURES_PAYMENT_ENABLED:false}
  ai-enabled: ${FEATURES_AI_ENABLED:false}
  submission-enabled: ${FEATURES_SUBMISSION_ENABLED:false}
reader:
  enabled: ${READER_ENABLED:true}
  tts:
    enabled: ${READER_TTS_ENABLED:true}
    resource-directory: /opt/reader-resources
    manifest-url: /reader/tts-manifest.json
templates:
  name: ${TEMPLATE_NAME:green}
website:
  name: ${WEBSITE_NAME:小说精品屋}
  domain: ${WEBSITE_DOMAIN:}
seo:
  enabled: ${SEO_ENABLED:false}
  site-url: ${SEO_SITE_URL:}
  sitemap-directory: /data/seo
  content-directory: /data/books
  sitemap-worker-enabled: ${SEO_SITEMAP_WORKER_ENABLED:true}
  worker-delay-ms: ${SEO_WORKER_DELAY_MS:1000}
  sitemap-urls-per-part: 20000
  sitemap-max-bytes: 10485760


# Clear bundled example credentials. To enable optional integrations, migrate
# your private values into a separate config file; do not put them in the image.
novel:
  file:
    key-id: ${OSS_ACCESS_KEY_ID:}
    key-secret: ${OSS_ACCESS_KEY_SECRET:}
alipay:
  app-id: ${ALIPAY_APP_ID:}
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  public-key: ${ALIPAY_PUBLIC_KEY:}
  notify-url: ${ALIPAY_NOTIFY_URL:}
  return-url: ${ALIPAY_RETURN_URL:}

---
spring:
  config:
    activate:
      on-profile: linux-front
  thymeleaf:
    prefix: file:/app/templates/${TEMPLATE_NAME:green}/html/
    suffix: .html
  web:
    resources:
      static-locations: file:/app/templates/${TEMPLATE_NAME:green}/static/,classpath:/static/
