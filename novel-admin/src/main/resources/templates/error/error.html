<!DOCTYPE html>
<html>
<head>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>
    <script th:src="@{/js/csrf.js}" src="/js/csrf.js" defer></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorCode} + '错误'">请求错误</title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <link rel="shortcut icon" href="/favicon.ico"> <link href="/css/bootstrap.min.css?v=5.3.8" rel="stylesheet">
    <link href="/css/font-awesome.css?v=4.4.0" rel="stylesheet">
    <link href="/css/animate.css" rel="stylesheet">
    <link href="/css/style.css?v=4.1.0" rel="stylesheet">
<link href="/css/bootstrap-compat.css?v=5.3.8-1" rel="stylesheet">
</head>
<body class="gray-bg">
    <div class="middle-box text-center animated fadeInDown">
        <h1 th:text="${errorCode}">错误</h1>
        <h3 class="font-bold" th:text="${errorMessage}">请求失败</h3>
        <div class="error-desc">
            	您可以返回主页看看<br/>
            <a href="/" class="btn btn-primary m-t">主页</a>
        </div>
    </div>
    <!-- 全局js -->
    <script src="/js/vendor/jquery/jquery-4.0.0.min.js"></script>
<script src="/js/vendor/jquery/jquery-migrate-4.0.2.min.js"></script>
<script src="/js/vendor/jquery/jquery-legacy-compat.js?v=1"></script>
    <script src="/js/bootstrap.min.js?v=5.3.8"></script>
<script src="/js/bootstrap-compat.js?v=5.3.8-1"></script>
</body>
</html>
