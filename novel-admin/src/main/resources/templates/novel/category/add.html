<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/js/csrf.js}" src="/js/csrf.js" defer></script>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="novel-form-horizontal m-t" id="signupForm">
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label">分类名：</label>
                            <div class="col-sm-3">
                                <input id="name" name="name"
                                       class="form-control"
                                       type="text" maxlength="10">

                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label">排序：</label>
                            <div class="col-sm-2">
                                <input id="sort" name="sort"
                                       class="form-control"
                                       type="number" maxlength="2">

                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-8 offset-sm-3">
                                <button type="submit" class="btn btn-primary">提交</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/wangEditor/release/wangEditor.js"></script>
<script type="text/javascript" src="/js/appjs/novel/category/add.js">
</script>
</body>
</html>
