<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/js/csrf.js}" src="/js/csrf.js" defer></script>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
            <div class="ibox-content">
            <form class="novel-form-horizontal m-t" id="signupForm">
                <input id="id" name="id" th:value="${bookContent.id}"
                       type="hidden">
                                                                                            <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">目录ID：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${bookContent.indexId}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">小说章节内容：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${bookContent.content}">
                            </div>
                        
                        

                    </div>
                                                    </form>
            </div>
        </div>
    </div>
</div>
</div>
<div th:include="include::footer"></div>
</body>
</html>
