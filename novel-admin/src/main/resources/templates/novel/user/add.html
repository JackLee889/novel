<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/js/csrf.js}" src="/js/csrf.js" defer></script>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="novel-form-horizontal m-t" id="signupForm">
                                                                                                                                        <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">登录名：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="username" name="username"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">登录密码：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="password" name="password"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">昵称：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="nickName" name="nickName"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">用户头像：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="userPhoto" name="userPhoto"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">用户性别，0：男，1：女：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="userSex" name="userSex"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">账户余额：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="accountBalance" name="accountBalance"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">用户状态，0：正常：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="status" name="status"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">创建时间：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input type="text" class="laydate-icon layer-date form-control"
                                                   id="createTime"
                                                   name="createTime"
                                                   onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                                   style="background-color: #fff;" readonly="readonly"/>
                                        
                                    </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">更新时间：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input type="text" class="laydate-icon layer-date form-control"
                                                   id="updateTime"
                                                   name="updateTime"
                                                   onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                                   style="background-color: #fff;" readonly="readonly"/>
                                        
                                    </div>
                                </div>
                                                                            <div class="row mb-3">
                            <div class="col-sm-8 offset-sm-3">
                                <button type="submit" class="btn btn-primary">提交</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/wangEditor/release/wangEditor.js"></script>
<script type="text/javascript" src="/js/appjs/novel/user/add.js">
</script>
</body>
</html>
