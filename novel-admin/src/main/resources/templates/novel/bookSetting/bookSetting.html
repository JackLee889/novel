<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/js/csrf.js}" src="/js/csrf.js" defer></script>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content">
    <div class="col-sm-12">
        <div class="ibox">
            <div class="ibox-body">
                <div class="fixed-table-toolbar">
                    <div class="columns float-end">
                        <button class="btn btn-success" onclick="reLoad()">查询</button>
                    </div>

                    <form id="searchForm">
                        <div class="columns float-end col-md-2">
                            <select data-placeholder="--推荐类型--" id="type"
                                    name="type"
                                    class="form-control chosen-select" tabindex="2"
                                    dict-type="book_rec_type">
                            </select>
                        </div>
                    </form>

                </div>
                <table id="exampleTable" data-mobile-responsive="true">
                </table>
            </div>
        </div>
    </div>
</div>
<!--shiro控制bootstraptable行内按钮看见性 -->
<div>
    <script type="text/javascript">
        var s_detail_h = 'd-none';
        var s_edit_h = 'd-none';
        var s_remove_h = 'd-none';
    </script>
</div>
<div shiro:hasPermission="novel:bookSetting:detail">
    <script type="text/javascript">
        s_detail_h = '';
    </script>
</div>
<div shiro:hasPermission="novel:bookSetting:edit">
    <script type="text/javascript">
        s_edit_h = '';
    </script>
</div>
<div shiro:hasPermission="novel:bookSetting:remove">
    <script type="text/javascript">
        var s_remove_h = '';
    </script>
</div>
<div th:include="include :: footer"></div>
<script type="text/javascript" src="/js/appjs/novel/bookSetting/bookSetting.js"></script>
</body>
</html>
