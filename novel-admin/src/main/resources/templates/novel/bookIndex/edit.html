<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/js/csrf.js}" src="/js/csrf.js" defer></script>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="novel-form-horizontal m-t" id="signupForm">
                        <input id="id" name="id" th:value="${bookIndex.id}"
                               type="hidden">
                                                                                                                                        <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">小说ID：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="bookId" name="bookId"
                                                   th:value="${bookIndex.bookId}"
                                                   class="form-control"
                                                   type="text">
                                                                            </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">目录号：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="indexNum" name="indexNum"
                                                   th:value="${bookIndex.indexNum}"
                                                   class="form-control"
                                                   type="text">
                                                                            </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">目录名：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="indexName" name="indexName"
                                                   th:value="${bookIndex.indexName}"
                                                   class="form-control"
                                                   type="text">
                                                                            </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">字数：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="wordCount" name="wordCount"
                                                   th:value="${bookIndex.wordCount}"
                                                   class="form-control"
                                                   type="text">
                                                                            </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">是否收费，1：收费，0：免费：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="isVip" name="isVip"
                                                   th:value="${bookIndex.isVip}"
                                                   class="form-control"
                                                   type="text">
                                                                            </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">章节费用（屋币）：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="bookPrice" name="bookPrice"
                                                   th:value="${bookIndex.bookPrice}"
                                                   class="form-control"
                                                   type="text">
                                                                            </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">存储方式：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="storageType" name="storageType"
                                                   th:value="${bookIndex.storageType}"
                                                   class="form-control"
                                                   type="text">
                                                                            </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input type="text" class="laydate-icon layer-date form-control"
                                                   id="createTime"
                                                   name="createTime"
                                                   th:value="${bookIndex.createTime}==null?null:${#dates.format(bookIndex.createTime,'yyyy-MM-dd HH:mm:ss')}"
                                                   onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                                   style="background-color: #fff;" readonly="readonly"/>
                                                                            </div>
                                </div>
                                                                                                                <div class="row mb-3">
                                                                            <label class="col-sm-3 col-form-label">：</label>
                                                                        <div class="col-sm-8">
                                                                                    <input type="text" class="laydate-icon layer-date form-control"
                                                   id="updateTime"
                                                   name="updateTime"
                                                   th:value="${bookIndex.updateTime}==null?null:${#dates.format(bookIndex.updateTime,'yyyy-MM-dd HH:mm:ss')}"
                                                   onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                                   style="background-color: #fff;" readonly="readonly"/>
                                                                            </div>
                                </div>
                                                                            <div class="row mb-3">
                            <div class="col-sm-8 offset-sm-3">
                                <button type="submit" class="btn btn-primary">提交</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/wangEditor/release/wangEditor.js"></script>
<script type="text/javascript" src="/js/appjs/novel/bookIndex/edit.js">
</script>
</body>
</html>
