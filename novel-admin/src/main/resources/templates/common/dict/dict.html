<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/js/csrf.js}" src="/js/csrf.js" defer></script>
</head>
<body class="gray-bg">
	<div class="wrapper wrapper-content">
		<div class="col-sm-12">
			<div class="ibox">
				<div class="ibox-body">
					<div class="fixed-table-toolbar">
						<div class="columns float-start">
							<button shiro:hasPermission="common:dict:add" type="button"
								class="btn btn-primary" onclick="add()">
								<i class="fa fa-plus" aria-hidden="true"></i>添加
							</button>
							<button shiro:hasPermission="common:dict:batchRemove"
								type="button" class="btn btn-danger" onclick="batchRemove()">
								<i class="fa fa-trash" aria-hidden="true"></i>删除
							</button>
						</div>
						<div class="columns float-end">
							<button class="btn btn-success" onclick="reLoad()">查询</button>
						</div>
						<div class="columns float-end col-md-2">
							<select data-placeholder="选择类别" class="form-control chosen-select"
								tabindex="2" style="width: 100%">
								<option value="">选择类别</option>
							</select>
						</div>
					</div>
					<table id="exampleTable" data-mobile-responsive="true">
					</table>
				</div>
			</div>
		</div>
	</div>
	<!--shiro控制bootstraptable行内按钮看见性-->
	<div>
		<script type="text/javascript">
			var s_edit_h = 'd-none';
			var s_remove_h = 'd-none';
			var s_resetPwd_h = 'd-none';
		</script>
	</div>
	<div shiro:hasPermission="common:dict:edit">
		<script type="text/javascript">
			s_edit_h = '';
		</script>
	</div>
	<div shiro:hasPermission="common:dict:remove">
		<script type="text/javascript">
			var s_remove_h = '';
		</script>
	</div>
	<div shiro:hasPermission="common:dict:add">
		<script type="text/javascript">
			var s_add_h = '';
		</script>
	</div>

	</div>
	<div th:include="include :: footer"></div>
	<script type="text/javascript"
		src="/js/appjs/common/dict/dict.js"></script>
</body>
</html>
